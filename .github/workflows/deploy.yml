name: Deploy to Prod sikilat.givenjeremia.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: GukGukGuk
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            echo "===== START DEPLOY ====="

            cd ~/domains/sikilat.givenjeremia.com/public_html

            echo "Current directory:"
            pwd

            echo "Files:"
            ls -lah

            echo "Check artisan:"
            ls -lah artisan || true

            echo "Check composer:"
            ls -lah composer.json || true

            echo "PHP:"
            which /opt/alt/php84/usr/bin/php
            /opt/alt/php84/usr/bin/php -v

            echo "Git pull"
            git pull origin main

            # echo "Write .env"
            # cat > .env <<'EOF'
            # ${{ secrets.APP_ENV_FILE }}
            # EOF

            # echo "Composer install"
            # composer install --no-dev --prefer-dist --optimize-autoloader

            echo "Before artisan"
            pwd
            ls -lah artisan
            /opt/alt/php84/usr/bin/php artisan --version

            # echo "Migration"
            # php artisan migrate --force

            echo "Clear cache"
            /opt/alt/php84/usr/bin/php artisan config:clear
            /opt/alt/php84/usr/bin/php artisan cache:clear
            /opt/alt/php84/usr/bin/php artisan route:clear
            /opt/alt/php84/usr/bin/php artisan view:clear

            echo "Build cache"
            /opt/alt/php84/usr/bin/php artisan config:cache
            /opt/alt/php84/usr/bin/php artisan route:cache
            /opt/alt/php84/usr/bin/php artisan view:cache

            echo "Optimize"
            /opt/alt/php84/usr/bin/php artisan optimize

            echo "===== DEPLOY SUCCESS ====="